[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpal-agent"
version = "0.1.0"
description = "GPAL (Google Pal): An empathetic voice and text companion agent built with ADK-Python, Gemini TTS & Live Audio, Google Search grounding, Model Armor PII scrubbing, and OpenTelemetry Cloud Tracing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "GPAL Contributors" }
]
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.30",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-dlp>=3.18.0",
    "google-cloud-logging>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gpal_agent*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

